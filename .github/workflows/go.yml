# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  dlock-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dlock_test
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: dlock_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdlock_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_MYSQL_REQUIRED: '1'
      TEST_MYSQL_HOST: 127.0.0.1:3306
      TEST_MYSQL_DB: dlock_test
      TEST_MYSQL_USER: root
      TEST_MYSQL_PWD: dlock_test
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v4
      with:
        go-version-file: go.mod
    - name: Test MySQL lock semantics
      run: go test -race -count=1 -v ./dlock
